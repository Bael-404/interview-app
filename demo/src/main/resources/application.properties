spring.application.name=demo

# Vertel Spring Boot om een H2 database in het geheugen te maken
spring.datasource.url=jdbc:h2:mem:interviewdemodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Hibernate instellingen
# "update" zorgt ervoor dat Hibernate automatisch onze SQL tabellen aanmaakt!
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

# Maak de H2 web console beschikbaar (zodat we zelf in de database kunnen kijken)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
