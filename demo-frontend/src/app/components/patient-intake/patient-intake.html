<div class="max-w-2xl mx-auto my-10 font-sans">
  <div class="bg-white shadow-md rounded-lg p-6">
    <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-2">Patiënt Intake Formulier (ClickCare Demo)</h2>
    
    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Naam:</label>
        <input type="text" [(ngModel)]="newPatient.name" name="name" required 
               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">E-mail:</label>
        <input type="email" [(ngModel)]="newPatient.email" name="email" required 
               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Klacht:</label>
        <textarea [(ngModel)]="newPatient.complaint" name="complaint" required 
                  class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 h-32"></textarea>
      </div>
      
      <button type="submit" [disabled]="isLoading"
              class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-md hover:bg-blue-700 transition duration-300 ease-in-out transform hover:-translate-y-1 disabled:opacity-50 disabled:cursor-not-allowed">
        {{ isLoading ? 'Bezig met opslaan...' : 'Patiënt Registreren' }}
      </button>
    </form>
  </div>

  <div class="mt-8 bg-white shadow-md rounded-lg p-6">
    <h3 class="text-xl font-semibold text-gray-800 mb-4">Geregistreerde Patiënten</h3>
    <ul class="divide-y divide-gray-200">
      <li *ngFor="let p of patients" class="py-3">
        <div class="flex items-center justify-between">
            <div>
                <strong class="text-gray-900 block">{{ p.name }}</strong>
                <span class="text-gray-500 text-sm">{{ p.email }}</span>
            </div>
            <em class="text-gray-600 italic bg-gray-100 px-2 py-1 rounded">{{ p.complaint }}</em>
        </div>
      </li>
    </ul>
    <div *ngIf="patients.length === 0" class="text-gray-500 text-center italic py-4">
        Nog geen patiënten geregistreerd.
    </div>
  </div>
</div>
